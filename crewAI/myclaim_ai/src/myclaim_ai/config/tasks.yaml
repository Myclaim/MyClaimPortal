routing_task:
  description: >
    Analyze the user query: "{user_query}"
    Determine which of the following agents are required to fulfill the user's request.
    Agents available:
    - claim_agent (for claim status, lists, metrics)
    - document_agent (for document compliance, missing documents, file status)
    - employee_agent (for HR, adjuster rosters, staff)
    - partner_agent (for clinics, hospitals, contracts)
    - finance_agent (for payouts, finance summary, liability)
    - notification_agent (for sending alerts/messages)
    - reporting_agent (for generating formal business reports)

    Return a list of selected agent names in the order they should execute to fulfill the query.
    For example, for "Show pending claims", you should select: ["claim_agent"].
    For "Generate business report", you should select: ["claim_agent", "finance_agent", "reporting_agent"].
    For "Show missing documents", you should select: ["document_agent"].
    For "Send alert about pending claims", you should select: ["claim_agent", "notification_agent"].
  expected_output: >
    A JSON-style list of agent names to execute (e.g. ["claim_agent"]) or a structured routing instruction.
  agent: exchange_agent

claim_analysis_task:
  description: >
    Process the user query: "{user_query}"
    Use the get_claim_summary or get_pending_claims tools as needed to fetch current claim metrics.
    Analyze the data and prepare a comprehensive response.
  expected_output: >
    Detailed claim details or analytics responding to the user's request.
  agent: claim_agent

document_query_task:
  description: >
    Process the user query: "{user_query}"
    Use the get_missing_documents tool to analyze document requirements and status.
    Identify missing invoices, files, or compliance issues.
  expected_output: >
    A list of missing documents or status reports matching the user query.
  agent: document_agent

employee_query_task:
  description: >
    Process the user query: "{user_query}"
    Use the get_employee_summary tool to fetch employee/adjuster headcount and operational status.
  expected_output: >
    Roster or staffing summary answering the user query.
  agent: employee_agent

partner_query_task:
  description: >
    Process the user query: "{user_query}"
    Use the get_partner_list tool to retrieve contract status and detail lists of hospital and clinic partners.
  expected_output: >
    A report on partner clinics, contracts, or details.
  agent: partner_agent

finance_query_task:
  description: >
    Process the user query: "{user_query}"
    Use the get_financial_summary tool to analyze MRR, payouts, and billing status.
  expected_output: >
    Financial metrics and audit details answering the user's request.
  agent: finance_agent

notification_trigger_task:
  description: >
    Process the user query: "{user_query}"
    Use the send_notification tool to dispatch a notification alert to the relevant manager/user.
    Use the context from previous tasks (if any) to formulate the message.
  expected_output: >
    Confirmation details of the simulated dispatch.
  agent: notification_agent

report_generation_task:
  description: >
    Generate a formal business report based on the analysis details from the previously run agents.
    The report MUST strictly follow this exact structure:

    # MyClaim Business Report

    ## Claims

    Pending Claims: [value]
    Completed Claims: [value]
    Rejected Claims: [value]

    ## Revenue

    Today's Revenue: [value]

    ## Leads

    New Leads: [value]

    ## Business Health Summary
    [A brief paragraph analyzing the overall health of claims, revenue efficiency, and lead activity.]

    ## Recommendations
    [Actionable business recommendations based on the findings, such as strategies to process pending claims or leverage new leads.]
  expected_output: >
    A business report in markdown format matching the requested structure.
  agent: reporting_agent

merge_task:
  description: >
    Analyze the original user query: "{user_query}"
    Review the compiled results and text outputs generated by the executed service agents:
    {agent_outputs}
    Synthesize these results into a clear, cohesive final answer for the user.
  expected_output: >
    The final consolidated response addressing the user's query.
  agent: exchange_agent