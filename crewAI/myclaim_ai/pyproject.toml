[project]
name = "myclaim_ai"
version = "0.1.0"
description = "myclaim_ai using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]==1.14.7",
]

[project.scripts]
myclaim_ai = "myclaim_ai.main:run"
run_crew = "myclaim_ai.main:run"
train = "myclaim_ai.main:train"
replay = "myclaim_ai.main:replay"
test = "myclaim_ai.main:test"
run_with_trigger = "myclaim_ai.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
